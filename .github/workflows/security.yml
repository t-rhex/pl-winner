name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 6 * * 1"   # Weekly Mon 06:13 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@cb7149b9b57195b609c63e8518d2c37118bccd80  # v2.3.9
        env:
          # GITLEAKS_LICENSE only needed for orgs > 25 contributors
          GITHUB_TOKEN: ${{ github.token }}

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@1220744eb24bd5f90f8b7889530b6306140d464d  # v1.1.0
        with:
          inputs: pyproject.toml
          # Don't fail on transitive that we can't fix; report-only.
          # Tighten with `vulnerability-service: osv` once we want to gate.

  bandit:
    name: Static security (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit[sarif]
      - name: Run bandit
        run: bandit -r src tools -f sarif -o bandit.sarif --severity-level medium || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.29.4
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          # Install the package + extras into the venv so SBOM captures pinned deps
          pip install -e ".[web]"
          cyclonedx-py environment --output-format json --output-file sbom.cdx.json
          # Also generate a human-readable form
          cyclonedx-py environment --output-format xml --output-file sbom.cdx.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.cdx.xml
          retention-days: 90
