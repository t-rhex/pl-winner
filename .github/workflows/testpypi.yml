name: TestPyPI

# Validates that every commit on main produces a publishable wheel by
# uploading to TestPyPI. Catches metadata regressions before they hit real PyPI.
#
# Setup (one-off):
#   1. Reserve `pl-winner` on TestPyPI: https://test.pypi.org/manage/account/publishing/
#   2. Add a Trusted Publisher pointing at this repo + workflow file `testpypi.yml`
#      + environment `testpypi`.
#   3. Create the GitHub environment `testpypi` (Settings → Environments).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/testpypi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build with a dev version suffix
        # TestPyPI is append-only too; we suffix every wheel with the run number
        # so we can re-upload from main without conflict.
        run: |
          pip install --upgrade pip build twine
          BASE=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          DEV_VERSION="${BASE}.dev${{ github.run_number }}"
          echo "Building $DEV_VERSION"
          # Inject the dev version without touching the file on disk
          SETUPTOOLS_SCM_PRETEND_VERSION="$DEV_VERSION" \
            python -m build
          # The file-based version still wins for setuptools; rebuild with sed shim
          sed -i "s/^version = \".*\"/version = \"$DEV_VERSION\"/" pyproject.toml
          rm -rf dist/
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pl-winner
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Don't fail the workflow if the version was already uploaded.
          skip-existing: true
